name: Deploy to nexura-server

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build bot
        working-directory: bot
        run: |
          npm ci
          npm run build

      - name: Build webapp (Telegram Mini App)
        working-directory: webapp
        run: |
          npm ci
          npm run build

      - run: npx pm2 startOrReload ecosystem.config.js --update-env
